services:
  aurai:
    image: ghcr.io/meceware/aurai:latest
    # Swap the image line for this to run your own build:
    # build: .
    container_name: aurai
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: .env
    volumes:
      # Must be a real local filesystem. SQLite's WAL uses shared memory and is unsafe on NFS
      # or SMB, where it will corrupt rather than merely slow down. Owned by uid 1000 (node).
      - ./data:/app/data
    stop_grace_period: 30s
